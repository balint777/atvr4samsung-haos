name: atvr4samsung Companion Bridge
version: "0.3.0"
slug: atvr4samsung
description: >-
  Emulate an Apple TV Companion endpoint and relay the native iPhone and Apple
  Watch Remotes to a Samsung Tizen TV.
url: https://github.com/balint777/atvr4samsung-haos
stage: experimental
startup: services
init: false
host_network: true
homeassistant_api: true
stdin: true
arch:
  - amd64
  - aarch64
options:
  device_name: Samsung TV
  companion_port: 49152
  apple_tv_model: AppleTV14,1
  samsung_host: ""
  samsung_mac: ""
  samsung_remote_name: atvr4samsung
  samsung_tls_fingerprint: ""
  wol_enabled: true
  wol_broadcast: 255.255.255.255
  wol_port: 9
  pairing_request: ""
  pairing_window_minutes: 5
  automatic_first_pairing: true
  reset_identity_request: ""
  log_level: INFO
schema:
  device_name: str
  companion_port: port
  apple_tv_model: str
  samsung_host: str
  samsung_mac: str
  samsung_remote_name: str
  samsung_tls_fingerprint: "str?"
  wol_enabled: bool
  wol_broadcast: str
  wol_port: port
  pairing_request: "str?"
  pairing_window_minutes: int
  automatic_first_pairing: bool
  reset_identity_request: "str?"
  log_level: list(DEBUG|INFO|WARNING|ERROR|CRITICAL)
