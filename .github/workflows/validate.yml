name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML
      - run: >-
          python -m pip install --no-deps --require-hashes
          -r atvr4samsung/build/homekit-requirements.txt
      - run: python -m unittest discover -s tests -v

  addon-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2.21
        with:
          path: ./atvr4samsung

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag atvr4samsung-haos:test ./atvr4samsung
      - run: >-
          docker run --rm --entrypoint python3 atvr4samsung-haos:test
          /usr/local/libexec/atvr4samsung-verify-touch-compat.py
      - run: >-
          docker run --rm --entrypoint python3 atvr4samsung-haos:test
          /usr/local/libexec/atvr4samsung-verify-watch-compat.py
      - run: >-
          docker run --rm --entrypoint python3 atvr4samsung-haos:test
          /usr/local/libexec/atvr4samsung-verify-watch-input.py
      - run: >-
          docker run --rm --entrypoint python3 atvr4samsung-haos:test
          /usr/local/libexec/atvr4samsung-verify-homekit-tv.py
